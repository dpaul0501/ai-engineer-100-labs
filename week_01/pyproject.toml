[project]
name = "tok"
version = "0.1.0"
description = "Week 1: a byte-level BPE tokenizer, samplers, and grammar-constrained JSON decoding"
license = {text = "CC-BY-4.0"}
requires-python = ">=3.11"
dependencies = ["regex>=2024.0", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100", "tokenizers>=0.19"]
stretch = ["tiktoken>=0.7"]

[project.scripts]
tok = "tok.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tok"]

[tool.pytest.ini_options]
testpaths = ["tests"]
