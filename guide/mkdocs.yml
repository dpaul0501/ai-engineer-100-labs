site_name: '100 Days: Daily Guide'
site_description: The self-paced daily guide for the 100-day Zero to One AI Engineer
  program.
repo_url: https://github.com/dpaul0501/ai-engineer-100-labs
copyright: Text and code by Debjyoti Paul, licensed under <a href="https://creativecommons.org/licenses/by/4.0/">CC
  BY 4.0</a>
docs_dir: docs
nav:
- Start here: index.md
- Month 1 plan: month_01.md
- Weeks:
  - 'Week 1: Tokenization':
    - Week reading: week_01/index.html
    - 'Day 1: Text as data': week_01/day_1.html
    - 'Day 2: The objective': week_01/day_2.html
    - 'Day 3: Information': week_01/day_3.html
    - 'Day 4: Fast training': week_01/day_4.html
    - 'Day 5: Encoding and serving': week_01/day_5.html
    - Worksheet and learning checks: week_01/worksheet.html
- By dimension:
  - DSA: tracks/dsa.md
  - ML: tracks/ml.md
  - AI: tracks/ai.md
  - System Design: tracks/system-design.md
  - Software Delivery: tracks/software-delivery.md
theme:
  name: material
  features:
  - navigation.sections
  - navigation.top
  - content.code.copy
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: indigo
    accent: deep purple
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: indigo
    accent: deep purple
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
markdown_extensions:
- admonition
- attr_list
- md_in_html
- pymdownx.details
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- tables
- toc:
    permalink: true
plugins:
- search
validation:
  anchors: warn
  unrecognized_links: warn
