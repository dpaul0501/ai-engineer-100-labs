name: Week 1 starter

on:
  push:
    paths: ["week_01/**"]
  workflow_dispatch:

jobs:
  starter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e "week_01[dev]"
      - name: The starter installs and its tests collect
        run: cd week_01 && python -m pytest --collect-only -q
