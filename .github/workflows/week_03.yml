name: Week 3 starter

on:
  push:
    paths: ["week_03/**"]
  workflow_dispatch:

jobs:
  starter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e "week_03[dev]"
      - name: The starter installs and its tests collect
        run: cd week_03 && python -m pytest --collect-only -q
